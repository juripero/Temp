[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38-gfx1201-decode"
version = "0.2.0"
description = "Qwen3.5-compatible 27B TP1 BF16 FlyDSL 0.5.0 FFN source and validation tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
flydsl = ["flydsl==0.5.0"]

[tool.setuptools.packages.find]
include = ["specialized_decode*"]
